# Image de la branche `beta`, déployée en continu par l'Argo CD d'internal-gw (dépôt
# IA-Generative/mirai-apps-beta-private, Application `beta-myagents`, ADR-0005) sur
# https://mesagents.numerique-interieur.com. Chaque fusion dans `beta` publie la même image sous
# deux étiquettes : `beta` (mobile) et `beta-<sha8>` (fixe — celle que le cluster tire : Argo CD la
# déduit du commit qu'il déploie, le chart et l'image viennent donc toujours du même commit).
# Les PR (`pr-<n>`) restent l'affaire de ci.yml, les versions publiées (X.Y.Z) celle de cd.yml.
name: Branches

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions: {}

concurrency:
  group: branches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infos:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      sha8: ${{ steps.v.outputs.sha8 }}
    steps:
      - id: v
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  # fabnum ajoute d'office l'étiquette au nom de la branche (hors main/develop) : IMAGE_TAG ne
  # porte donc que l'étiquette fixe. Le job verify prouve que les deux existent.
  build:
    needs: [infos]
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/mes-agents
      IMAGE_TAG: beta-${{ needs.infos.outputs.sha8 }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./Dockerfile
      PUSH: true
      BUILD_ARM64: false

  verify:
    needs: [infos, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    env:
      # fabnum normalise le nom en minuscules ; docker refuse une majuscule dans une référence.
      IMAGE: ghcr.io/${{ github.repository }}/mes-agents
      SHA8: ${{ needs.infos.outputs.sha8 }}
      ACTOR: ${{ github.actor }}
      TOKEN: ${{ github.token }}
    steps:
      - name: Les deux étiquettes désignent la même image, qui porte le commit construit
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          mobile=$(docker buildx imagetools inspect "$IMAGE:beta" --format '{{.Manifest.Digest}}')
          fixe=$(docker buildx imagetools inspect "$IMAGE:beta-$SHA8" --format '{{.Manifest.Digest}}')
          echo "beta → $mobile ; beta-$SHA8 → $fixe"
          [ "$mobile" = "$fixe" ] || { echo "::error::beta et beta-$SHA8 divergent"; exit 1; }
          # Étiquette OCI posée par fabnum : ce que le cluster tire doit dire le commit fusionné.
          revision=$(docker buildx imagetools inspect "$IMAGE:beta-$SHA8" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
          [ "$revision" = "$GITHUB_SHA" ] \
            || { echo "::error::l'image annonce le commit « $revision », pas $GITHUB_SHA"; exit 1; }
