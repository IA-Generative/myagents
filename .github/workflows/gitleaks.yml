name: gitleaks

# Filet réseau anti-leak : scanne tout l'historique git à chaque push / PR.
#
# On installe le binaire gitleaks en direct plutôt que gitleaks/gitleaks-action@v2,
# qui exige une licence payante pour les organisations (sinon le job échoue en ~4 s
# avec « missing gitleaks license » sans rien scanner). Le binaire est gratuit et
# bloque le job dès qu'une fuite est trouvée (gitleaks git ... --exit-code 1).
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet pour scanner tous les commits
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan git history
        run: gitleaks git . --redact --verbose --exit-code 1
