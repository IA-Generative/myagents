# Garde-fous anti-leak — scan des secrets avant chaque commit.
# Installation : pre-commit install
# Scan ponctuel complet : pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Les gabarits Helm ne sont pas du YAML avant rendu : contrôlés par helm lint.
        exclude: ^helm/templates/
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/server/
      - id: ruff-format
        files: ^apps/server/

  - repo: local
    hooks:
      - id: eslint-web
        name: eslint (apps/web)
        entry: bash -c 'cd apps/web && bun run lint'
        language: system
        files: ^apps/web/.*\.(vue|ts|js)$
        pass_filenames: false

      - id: vue-tsc-web
        name: vue-tsc (apps/web)
        entry: bash -c 'cd apps/web && bunx vue-tsc -b --noEmit'
        language: system
        files: ^apps/web/.*\.(vue|ts)$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
