# MirAI Agent Builder — Compose de dev local, 100% standalone.
#
# Aucune dépendance externe : Postgres est lancé ici et l'authentification est
# un stub local (pas de Keycloak). OpenWebUI est optionnel : lancé par le compose
# racine (`make up-owui`), il est joignable via le réseau partagé `myagents-shared`.

services:
  agent-builder:
    image: ${AGENT_BUILDER_IMAGE:-miraiku-agents:dev}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/agentbuilder?schema=public}
      OWUI_BASE_URL: ${OWUI_BASE_URL:-http://openwebui:8080}
      OWUI_PUBLIC_URL: ${OWUI_PUBLIC_URL:-http://localhost:3000}
      # --- SSO Keycloak (realm `myagents`) ---
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/myagents}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-miraiku-agents}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-miraiku-agents-secret}
    ports:
      - "${AGENT_BUILDER_PORT:-3001}:3000"
    networks:
      - default
      - shared
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: agentbuilder
    volumes:
      - agent-builder-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agentbuilder"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Job one-shot de migration Prisma — joue prisma migrate deploy puis s'éteint.
  # Utilise le stage `builder` (node_modules complet incluant le CLI prisma)
  # plutôt que le runner minimaliste qui n'a que @prisma/client.
  migrate:
    image: miraiku-agents:migrator
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/agentbuilder?schema=public}
    command: ["bunx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

networks:
  # Même `name:` que dans le compose racine : le premier lancé crée le réseau.
  shared:
    name: myagents-shared

volumes:
  agent-builder-postgres-data:

