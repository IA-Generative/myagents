[project]
name = "server"
version = "0.1.0"
description = "API FastAPI de création et de catalogue d'agents IA"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# B008: FastAPI's Depends()-as-default is the intended, documented pattern.
ignore = ["B008"]
