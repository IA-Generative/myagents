# Dev local apps/server (FastAPI, hot reload) + apps/web (Vite, hot reload).
# apps/next tourne séparément : voir apps/next/docker-compose.yml.

name: myagents

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
    volumes:
      # Postgres 18 : les données vivent sous /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    restart: unless-stopped

  server:
    build:
      context: apps/server
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://agents:agents@postgres:5432/agents
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'
    volumes:
      - ./apps/server:/app
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; o=u.build_opener(u.ProxyHandler({})); sys.exit(0 if o.open('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: apps/web
    environment:
      API_PROXY_TARGET: http://server:8000
    volumes:
      - ./apps/web:/app
      # Volume anonyme : conserve les node_modules de l'image malgré le montage du source.
      - /app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
