# ============================================================================
# Beta/Preprod Values - MyAgents Helm Chart
# ============================================================================
# Environment-specific configuration for BETA (preprod/staging).
# Place this file in a PRIVATE repository.
#
# Usage:
#   helm install myagents-beta ./helm \
#     -f common.yaml \
#     -f values-beta.yaml \
#     -n myagents-beta

app:
  # -- Reduced replicas for beta
  replicaCount: 1
  
  # -- Resource allocation for beta
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # -- Autoscaling disabled in beta
  autoscaling:
    enabled: false
  
  # -- Pod Disruption Budget disabled in beta
  pdb:
    enabled: false
  
  # -- Optional ingress for beta
  ingress:
    enabled: false
  
  # -- Beta environment variables
  # These MUST be set in the private values file
  env: {}
    # ENVIRONMENT: "staging"
    # QDRANT_URL: "http://qdrant:6333"
    # LLM_BASE_URL: "https://api.openai.com"
    # LLM_DEFAULT_MODEL: "gpt-4"
    # LLM_EMBEDDING_MODEL: "text-embedding-3-large"
    # CORS_ORIGINS: '["https://beta.mes-agents.example.com"]'
  
  # -- Beta secrets from Vault
  envSecret: {}
    # LLM_API_KEY:
    #   secretKeyRef:
    #     name: "myagents-secrets"
    #     key: "LLM_API_KEY"
    # OPENWEBUI_API_KEY:
    #   secretKeyRef:
    #     name: "myagents-secrets"
    #     key: "OPENWEBUI_API_KEY"

# =============================================================================
# PostgreSQL - Beta settings
# =============================================================================
postgres:
  # -- Beta database user
  username: "mesagents_beta"
  database: "mesagents_beta"
  
  # -- Password MUST be empty - use existingSecret instead
  password: ""
  
  # -- Reference the beta PostgreSQL secret from Vault
  existingSecret: "postgres-secret"
  existingSecretKey: "password"
  
  # -- Beta storage (minimal)
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  
  # -- Beta resource allocation for PostgreSQL
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# =============================================================================
# Vault Secrets Operator - Beta configuration
# =============================================================================
vaultSecrets:
  # -- Enable secret synchronization from Vault
  enabled: true
  
  # -- Vault KV mount
  mount: "kv"
  
  # -- Vault base path for beta environment
  # Set to your beta path in Vault (e.g., "myagents/beta")
  basePath: "myagents/beta"
  
  # -- Secrets to synchronize from Vault
  items:
    # -- Application secrets
    - subPath: "app"
      destination:
        name: "myagents-secrets"
        type: "Opaque"
      rolloutRestartTargets:
        - kind: Deployment
          name: mes-agents
    
    # -- PostgreSQL secrets
    - subPath: "postgres"
      destination:
        name: "postgres-secret"
        type: "Opaque"
      rolloutRestartTargets:
        - kind: StatefulSet
          name: postgres
        - kind: Deployment
          name: mes-agents
