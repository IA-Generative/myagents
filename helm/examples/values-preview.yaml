# ============================================================================
# Preview Values - MyAgents Helm Chart
# ============================================================================
# Environment-specific configuration for PREVIEW (Pull Requests).
# Place this file in a PRIVATE repository.
#
# Usage:
#   helm install myagents-preview ./helm \
#     -f common.yaml \
#     -f values-preview.yaml \
#     -n myagents-preview

app:
  # -- Single replica for preview
  replicaCount: 1
  
  # -- Resource allocation for preview (minimal)
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  
  # -- Autoscaling disabled in preview
  autoscaling:
    enabled: false
  
  # -- Pod Disruption Budget disabled in preview
  pdb:
    enabled: false
  
  # -- Ingress disabled in preview (use port-forward instead)
  ingress:
    enabled: false
  
  # -- Non-secret variables. Le host Keycloak, l'URL du LLM et le modele restent dans Vault.
  # WEB_PUBLIC_URL / PUBLIC_BASE_URL / CORS_ORIGINS sont derives du 1er host d'ingress (pose par
  # l'ApplicationSet avec le numero de PR) ; les definir ici les surchargerait.
  env:
    ENVIRONMENT: "preview"
    OIDC_ENABLED: "true"
    OIDC_CLIENT_ID: "myagents-server-preview"
  
  # -- Tout le Secret synchronise depuis Vault (kv/<basePath>/app) est injecte en variables d'env.
  # Cles attendues dans Vault : DATABASE_URL, OIDC_ISSUER, OIDC_CLIENT_SECRET, OPENAI_BASE_URL,
  # OPENAI_API_KEY, LLM_DEFAULT_MODEL, OPENWEBUI_API_KEY, SESSION_SECRET, PRESENTATION_LINK_SECRET.
  # Optionnelles : OIDC_INTERNAL_URL, OIDC_JWKS_URL, QDRANT_URL, LLM_EMBEDDING_MODEL.
  envFromSecrets:
    - myagents-secrets

# =============================================================================
# PostgreSQL - Preview settings
# =============================================================================
postgres:
  # -- Base externe : DATABASE_URL vient de Vault, pas de sous-chart postgres
  enabled: false

# =============================================================================
# Vault Secrets Operator - Preview configuration
# =============================================================================
vaultSecrets:
  # -- Enable secret synchronization from Vault
  enabled: true
  
  # -- Vault KV mount
  mount: "kv"
  
  # -- Vault base path for preview environment
  # Set to your preview path in Vault (e.g., "myagents/preview")
  basePath: "myagents/preview"
  
  # -- Secrets to synchronize from Vault
  items:
    # -- Application secrets
    - subPath: "app"
      destination:
        name: "myagents-secrets"
        type: "Opaque"
        rolloutRestartTargets:
          - kind: Deployment
            name: mes-agents
