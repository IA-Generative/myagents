{{- if and .Values.enabled .Values.legifrance.enabled }}
# Serveur MCP Légifrance (PISTE), relayé par la capacité `legifrance.rechercher` (chantier 3).
# Dépôt IA-Generative/owuitools-legifrance ; identifiants PISTE dans un Secret existant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mes-agents.fullname" . }}-legifrance
  labels:
    {{- include "mes-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: legifrance
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mes-agents.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: legifrance
  template:
    metadata:
      labels:
        {{- include "mes-agents.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: legifrance
    spec:
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legifrance
          image: {{ .Values.legifrance.image }}
          imagePullPolicy: {{ .Values.legifrance.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PORT
              value: "8000"
            - name: PISTE_ENVIRONMENT
              value: {{ .Values.legifrance.environment | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.legifrance.existingSecret }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.legifrance.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mes-agents.fullname" . }}-legifrance
  labels:
    {{- include "mes-agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: legifrance
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "mes-agents.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: legifrance
{{- end }}
