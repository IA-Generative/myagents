{{- if and .Values.enabled .Values.app.migrations.enabled }}
{{- /* Helm : post-* (la base et son secret doivent exister avant le job).
     Argo CD ignore les annotations helm.sh/hook dès qu'il trouve les siennes : hook Sync de
     vague 1, donc après la base (vague 0) et avant le Deployment (vague 2) — la migration
     passe avant tout nouveau pod, comme le faisait scripts/deploy-myagents.sh. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mes-agents.fullname" . }}-migrate
  labels:
    {{- include "mes-agents.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.app.migrations.backoffLimit }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "mes-agents.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.app.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.app.securityContext | nindent 12 }}
          image: {{ include "mes-agents.image" . }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          {{- if .Values.app.migrations.seed }}
          command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.seed_agents"]
          {{- else }}
          command: ["alembic", "upgrade", "head"]
          {{- end }}
          env:
            {{- include "mes-agents.containerEnv" . | nindent 12 }}
          envFrom:
            {{- include "mes-agents.containerEnvFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.app.migrations.resources | nindent 12 }}
          {{- with .Values.app.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.app.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
