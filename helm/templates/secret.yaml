{{- if and .Values.enabled .Values.app.envSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mes-agents.fullname" . }}-env
  labels:
    {{- include "mes-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.app.envSecret }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
