{{- if and .Values.app.enabled .Values.app.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mes-agents.fullname" . }}
  labels:
    {{- include "mes-agents.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.containerPortName }}
      protocol: TCP
      name: {{ .Values.app.service.portName }}
  selector:
    {{- include "mes-agents.selectorLabels" . | nindent 4 }}
{{- end }}
