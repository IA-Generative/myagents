# Development environment overrides
# Usage with local Helm or minikube:
#   helm install mes-agents helm/ -f helm/values.yaml -f helm/values-dev.yaml

app:
  replicaCount: 1

  # Dev uniquement : sans SSO, le server utilise une identité locale (refusé en production).
  env:
    ENVIRONMENT: "development"
    OIDC_ENABLED: "false"
    OIDC_ISSUER: ""

  image:
    # Can use local or PR images for testing
    registry: "ghcr.io"
    repository: "ia-generative/myagents/mes-agents"
    # tag: "pr-42"  # Override for testing specific PR builds

  # Minimal resources for development
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # No autoscaling in dev
  autoscaling:
    enabled: false

  # No PDB in dev
  pdb:
    enabled: false

  # Optional ingress for dev (usually use port-forward)
  ingress:
    enabled: false

# Vault secrets for beta environment
vaultSecrets:
  enabled: true
  basePath: "myagents/beta"

# Development PostgreSQL (minimal)
postgres:
  enabled: true
  username: "mesagents_dev"
  database: "mesagents_dev"
  password: "dev-password-123"  # Not secret in dev, but use existingSecret in prod
  existingSecret: ""

  image:
    tag: "18.6-alpine"

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""  # Use default storage class

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
