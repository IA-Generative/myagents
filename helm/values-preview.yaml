# Development environment overrides
# Usage with local Helm or minikube:
#   helm install mes-agents helm/ -f helm/values.yaml -f helm/values-dev.yaml

app:
  replicaCount: 1

  image:
    # Can use local or PR images for testing
    registry: "ghcr.io"
    repository: "ia-generative/myagents/mes-agents"
    # tag: "pr-42"  # Override for testing specific PR builds

  env:
    ENVIRONMENT: "production"
    # Sans ces valeurs, le server retombe sur ses défauts localhost (voir apps/server/app/core/config.py).
    QDRANT_URL: "http://qdrant:6333"
    LLM_BASE_URL: ""
    LLM_DEFAULT_MODEL: "gpt-oss-120b"
    LLM_EMBEDDING_MODEL: "nomic-embed-text"
    CORS_ORIGINS: '["https://mes-agents.example.com"]'
    # DATABASE_URL is injected from postgres sub-chart secret when postgres.enabled=true
    # Override this if using an external database
    DATABASE_URL:
      valueFrom:
        secretKeyRef:
          name: ""  # Will be set to <release>-postgres by template if postgres.enabled
          key: "uri"

  # Minimal resources for development
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  # No autoscaling in dev
  autoscaling:
    enabled: false

  # No PDB in dev
  pdb:
    enabled: false

  # Optional ingress for dev (usually use port-forward)
  ingress:
    enabled: false

# Vault secrets for preview environment
vaultSecrets:
  enabled: true
  basePath: "myagents/preview"