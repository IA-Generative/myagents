# Production environment overrides
# Usage with ArgoCD:
#   - Use this file in your ArgoCD Application spec:
#     spec:
#       source:
#         helm:
#           valuesFiles:
#             - values.yaml
#             - values-prod.yaml

app:
  replicaCount: 3

  image:
    # Production GHCR image
    registry: "ghcr.io"
    repository: "ia-generative/myagent/mes-agents"
    # tag is set by CD pipeline (via ArgoCD sync or Kustomize)

  # Production resource allocation
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  # Enable autoscaling in production
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Pod Disruption Budget for high availability
  pdb:
    enabled: true
    minAvailable: 2

  # Production ingress
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - name: "mes-agents.example.com"
        paths:
          - path: "/"
            pathType: "Prefix"
    tls:
      - secretName: "mes-agents-tls"
        hosts:
          - "mes-agents.example.com"

# Vault secrets for production environment
vaultSecrets:
  enabled: true
  basePath: "myagents/prod"

# Production PostgreSQL settings
postgres:
  enabled: true
  username: "mesagents"
  database: "mesagents"
  # Password should be managed via existingSecret in production
  password: ""
  existingSecret: "postgres-secret"
  existingSecretKey: "password"

  image:
    tag: "18.6-alpine"

  persistence:
    enabled: true
    size: 10Gi
    storageClass: "fast-ssd"  # Adjust to your cluster's storage class

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
