# Staging environment overrides
# Usage with ArgoCD:
#   - Use this file in your ArgoCD Application spec:
#     spec:
#       source:
#         helm:
#           valuesFiles:
#             - values.yaml
#             - values-staging.yaml

app:
  replicaCount: 2

  image:
    # Staging GHCR image (same repo, but with staging tag or separate path)
    registry: "ghcr.io"
    repository: "wayii/mi-sdid/repos/mes-agents-private/mes-agents"
    # tag is set by CD pipeline

  # Staging resource allocation (moderate)
  resources:
    requests:
      memory: "384Mi"
      cpu: "200m"
    limits:
      memory: "768Mi"
      cpu: "500m"

  # Enable autoscaling in staging with lower thresholds
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85

  # Pod Disruption Budget (less strict than prod)
  pdb:
    enabled: true
    minAvailable: 1

  # Staging ingress
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-staging"
    hosts:
      - name: "mes-agents-staging.example.com"
        paths:
          - path: "/"
            pathType: "Prefix"
    tls:
      - secretName: "mes-agents-staging-tls"
        hosts:
          - "mes-agents-staging.example.com"

# Staging PostgreSQL settings
postgres:
  enabled: true
  username: "mesagents_staging"
  database: "mesagents_staging"
  # Password should be managed via existingSecret
  password: ""
  existingSecret: "postgres-staging-secret"
  existingSecretKey: "password"

  image:
    tag: "18.6-alpine"

  persistence:
    enabled: true
    size: 5Gi
    storageClass: "standard"  # Adjust to your cluster's storage class

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
