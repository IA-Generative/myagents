# ============================================================================
# MyAgents Helm Chart - Minimal Public Values
# ============================================================================
# This file contains ONLY the minimal scaffold for the Helm chart.
# All environment-specific and sensitive configurations are managed externally.
#
# For complete configuration, use a common values file from a private repository:
#   helm install myagents ./helm \
#     -f /path/to/private-config/common.yaml \
#     -f /path/to/private-config/values-<env>.yaml
#
# See ./HELM-ARCHITECTURE.md for the complete multi-repo strategy.

# =============================================================================
# Global configuration (scaffold)
# =============================================================================
global:
  env: {}
  imageRegistry: ""
  imagePullSecrets: []

# =============================================================================
# Application configuration (scaffold)
# =============================================================================
app:
  # -- Enable/disable the application deployment
  enabled: true
  
  # -- Number of replicas
  replicaCount: 1
  
  # -- Workload kind
  deploymentType: "Deployment"
  
  image:
    # -- Image registry
    registry: ""
    # -- Image repository
    repository: ""
    # -- Image pull policy
    pullPolicy: "IfNotPresent"
    # -- Image tag (defaults to Chart.appVersion)
    tag: ""
  
  imagePullSecrets: []
  
  # -- Container port
  containerPort: 8000
  containerPortName: "http"
  
  # -- Environment variables (non-secret)
  env: {}
  
  # -- Environment variables from ConfigMap
  envCm: {}
  
  # -- Environment variables from Secret
  # Configured in private values files
  envSecret: {}
  
  # -- Pod security context
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"
  
  # -- Container security context
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    seccompProfile:
      type: "RuntimeDefault"
  
  # -- Volumes
  volumes:
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}
  
  # -- Volume mounts
  volumeMounts:
    - mountPath: /tmp
      name: tmp
    - mountPath: /app/.cache
      name: cache
  
  # -- Probes
  probes:
    startupProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30
    readinessProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 20
  
  # -- Resources (defaults, override in environment files)
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # -- Autoscaling (disabled by default)
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  # -- Service
  service:
    enabled: true
    type: "ClusterIP"
    port: 80
    portName: "http"
  
  # -- Ingress
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  
  # -- Pod Disruption Budget
  pdb:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  
  # -- Service Account
  serviceAccount:
    enabled: false
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  
  # -- Strategy
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # -- Node selector
  nodeSelector: {}
  
  # -- Tolerations
  tolerations: []
  
  # -- Affinity
  affinity: {}

# =============================================================================
# PostgreSQL sub-chart (scaffold)
# =============================================================================
postgres:
  # -- Enable PostgreSQL (should be configured in private values)
  enabled: false
  
  # -- PostgreSQL username
  username: ""
  
  # -- PostgreSQL database
  database: ""
  
  # -- PostgreSQL password (MUST use existingSecret in production)
  password: ""
  
  # -- Existing secret containing the password
  existingSecret: ""
  
  # -- Key in the existing secret
  existingSecretKey: "password"
  
  image:
    tag: "18.6-alpine"
  
  persistence:
    enabled: false
    size: "1Gi"
    storageClass: ""
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# =============================================================================
# Vault Secrets Operator configuration (scaffold)
# =============================================================================
vaultSecrets:
  # -- Enable VaultStaticSecret resources
  enabled: false
  
  # -- Vault KV mount name
  mount: "kv"
  
  # -- Base path in Vault (MUST be set in private values)
  basePath: ""
  
  # -- Secrets to sync from Vault (MUST be configured in private values)
  items: []
