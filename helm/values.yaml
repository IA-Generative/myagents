# ============================================================================
# MyAgents Helm Chart - Minimal Public Values
# ============================================================================
# This file contains ONLY the minimal scaffold for the Helm chart.
# All environment-specific and sensitive configurations are managed externally.
#
# For complete configuration, use a common values file from a private repository:
#   helm install myagents ./helm \
#     -f /path/to/private-config/common.yaml \
#     -f /path/to/private-config/values-<env>.yaml
#
# See ./HELM-ARCHITECTURE.md for the complete multi-repo strategy.

# -- Interrupteur général du chart (le Job de migration en dépend aussi)
enabled: true

# -- Étiquettes ajoutées à toutes les ressources du chart (ex. mirai-preview: beta)
commonLabels: {}

# =============================================================================
# Global configuration (scaffold)
# =============================================================================
global:
  env: {}
  imageRegistry: ""
  imagePullSecrets: []

# =============================================================================
# Application configuration (scaffold)
# =============================================================================
app:
  # -- Enable/disable the application deployment
  enabled: true

  # -- Number of replicas
  replicaCount: 1

  # -- Workload kind
  deploymentType: "Deployment"

  # -- Extra annotations merged onto the Pod template (spec.template.metadata.annotations,
  # not just the Deployment's own metadata). Changing a value here forces a rollout even when
  # nothing else in the rendered manifest changes — e.g. a preview environment reusing a stable
  # image tag across commits can carry the commit SHA here to force a fresh pull on every push.
  podAnnotations: {}

  image:
    # -- Image registry
    registry: ""
    # -- Image repository
    repository: ""
    # -- Image pull policy. Always : une même étiquette est parfois republiée avec un autre
    # contenu ; IfNotPresent laisserait le nœud relancer une image périmée.
    pullPolicy: "Always"
    # -- Image tag (defaults to Chart.appVersion)
    tag: ""

  imagePullSecrets: []

  # -- Container port
  containerPort: 8000
  containerPortName: "http"

  # -- Environment variables (non-secret)
  env: {}

  # -- Environment variables from ConfigMap
  envCm: {}

  # -- Environment variables from Secret
  # Configured in private values files
  envSecret: {}

  # -- Names of existing Secrets injected whole via envFrom (e.g. Secrets synced by Vault)
  envFromSecrets: []

  # -- Pod security context
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
    seccompProfile:
      type: "RuntimeDefault"

  # -- Container security context
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    seccompProfile:
      type: "RuntimeDefault"

  # -- Volumes
  volumes:
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}

  # -- Volume mounts
  volumeMounts:
    - mountPath: /tmp
      name: tmp
    - mountPath: /app/.cache
      name: cache

  # -- Probes
  probes:
    startupProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30
    readinessProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: "/api/health"
        port: 8000
      initialDelaySeconds: 15
      periodSeconds: 20

  # -- Resources (defaults, override in environment files)
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # -- Autoscaling (disabled by default)
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # -- Service
  service:
    enabled: true
    type: "ClusterIP"
    port: 80
    portName: "http"

  # -- Ingress
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

  # -- Job de migration `alembic upgrade head` (+ agents par défaut si seed). Sous Argo CD,
  # c'est un hook Sync de vague 1 : après la base (vague 0), avant le Deployment (vague 2).
  migrations:
    enabled: true
    seed: false
    backoffLimit: 3
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"

  # -- Pod Disruption Budget
  pdb:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""

  # -- Service Account
  serviceAccount:
    enabled: false
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: false

  # -- Strategy
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  # -- Node selector
  nodeSelector: {}

  # -- Tolerations
  tolerations: []

  # -- Affinity
  affinity: {}

# =============================================================================
# PostgreSQL sub-chart (scaffold)
# =============================================================================
postgres:
  # -- Enable PostgreSQL (should be configured in private values)
  enabled: false

  # -- Identifiants du sous-chart cloudpirates (clés auth.*). Avec existingSecret, le
  # sous-chart ne crée pas son Secret : DATABASE_URL doit alors venir de app.envFromSecrets.
  # Sans existingSecret, DATABASE_URL est lue dans le Secret généré (clé `uri`) — mais son
  # mot de passe est tiré par `lookup`, que Argo CD ne sait pas évaluer : à éviter sous Argo CD.
  auth:
    username: ""
    database: ""
    password: ""
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "postgres-password"

  image:
    tag: "18.6-alpine"

  persistence:
    enabled: false
    size: "1Gi"
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# =============================================================================
# Vault Secrets Operator configuration (scaffold)
# =============================================================================
vaultSecrets:
  # -- Enable VaultStaticSecret resources
  enabled: false

  # -- Vault KV mount name
  mount: "kv"

  # -- Base path in Vault (MUST be set in private values)
  basePath: ""

  # -- Secrets to sync from Vault (MUST be configured in private values)
  items: []
